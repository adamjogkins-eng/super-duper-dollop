<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XCode Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-color: #020617; }
        body, html { background-color: var(--bg-color); font-family: -apple-system, sans-serif; overflow: hidden; height: 100%; width: 100%; margin: 0; color: white; touch-action: manipulation; }
        .screen { height: 100vh; width: 100vw; display: flex; flex-direction: column; background: radial-gradient(circle at 50% 0%, #1e1b4b, #020617); position: relative; }
        
        .status-bar { padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 50; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .home-container { flex: 1; position: relative; overflow: hidden; }
        #page-wrapper { display: flex; width: 100%; transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1); height: 100%; }
        .home-page { min-width: 100%; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 110px; gap: 10px; padding: 25px; box-sizing: border-box; }
        
        .app-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.2s; }
        .app-icon:active { transform: scale(0.9); }
        .icon-shape { width: 65px; height: 65px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.15); }
        
        .page-dots { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: center; gap: 8px; pointer-events: none; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all 0.3s; }
        .dot.active { background: white; transform: scale(1.3); }

        .app-window { position: fixed; inset: 0; background: #020617; z-index: 1000; display: none; flex-direction: column; animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .window-header { padding: 12px 20px; display: flex; align-items: center; border-bottom: 1px solid #1e293b; background: #0f172a; min-height: 64px; }
        
        #code-editor { flex: 1; background: #000; color: #4ade80; font-family: 'SF Mono', 'Courier New', monospace; padding: 15px; resize: none; border: none; outline: none; font-size: 12px; line-height: 1.4; }
        
        #game-arena { width: 100%; height: 160px; background: #38bdf8; position: relative; display: none; overflow: hidden; }
        #flappyCanvas { width: 100%; height: 100%; }

        .ai-panel { background: #0f172a; padding: 16px; border-top: 1px solid #334155; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
        
        #app-sandbox { flex: 1; border: none; background: white; }
        .loader { width: 18px; height: 18px; border: 2px solid white; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="screen">
    <div class="status-bar">
        <span id="clock" class="font-bold">12:00</span>
        <div class="flex items-center gap-2">
            <span class="text-blue-400 font-bold text-[10px] tracking-widest">XCODE MOBILE</span>
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
        </div>
    </div>

    <div class="home-container" id="home-container">
        <div id="page-wrapper"></div>
        <div class="page-dots" id="page-dots"></div>
    </div>

    <!-- Creator Window -->
    <div id="creator-window" class="app-window">
        <div class="window-header">
            <button onclick="closeWindow('creator-window')" class="text-slate-400 font-medium px-2">Cancel</button>
            <span class="font-bold flex-1 text-center">Studio</span>
            <button id="install-btn" onclick="installApp()" class="text-blue-400 font-bold px-2">Install</button>
        </div>
        
        <div id="game-arena">
            <canvas id="flappyCanvas"></canvas>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <span class="bg-black/40 px-3 py-1 rounded-full text-[10px] text-white uppercase font-bold">Compiling... Tap to play</span>
            </div>
        </div>

        <div class="px-4 py-3 bg-slate-900 border-b border-slate-800 flex gap-2">
            <input id="app-name-input" type="text" placeholder="Project Name" class="flex-1 bg-black border border-slate-700 p-2 rounded-lg text-white text-sm outline-none">
            <input id="app-icon-input" type="text" placeholder="Icon" class="w-12 bg-black border border-slate-700 p-2 rounded-lg text-center text-sm outline-none">
        </div>
        
        <textarea id="code-editor" spellcheck="false" readonly placeholder="Output stream..."></textarea>
        
        <div class="ai-panel">
            <div class="flex gap-2">
                <input id="ai-prompt" type="text" placeholder="Prompt (e.g. 'Snake game')" class="flex-1 bg-black border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-blue-500 transition-colors">
                <button id="ai-btn" onclick="askFlash()" class="bg-blue-600 px-5 py-3 rounded-xl font-bold flex items-center gap-2 active:scale-90 transition-transform">
                    <span id="ai-btn-text">Build</span>
                    <span id="ai-loader" class="loader hidden"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Runner Window -->
    <div id="runner-window" class="app-window">
        <div class="window-header">
            <button onclick="closeWindow('runner-window')" class="text-blue-400 font-bold px-2">Back</button>
            <span id="runner-title" class="flex-1 text-center font-bold text-sm">Preview</span>
            <button onclick="deleteCurrentApp()" class="text-red-500 font-medium px-2">Delete</button>
        </div>
        <iframe id="app-sandbox"></iframe>
    </div>

    <!-- Settings Window -->
    <div id="settings-window" class="app-window">
        <div class="window-header">
            <button onclick="closeWindow('settings-window')" class="text-slate-400 px-2">Close</button>
            <span class="font-bold flex-1 text-center">Settings</span>
            <button onclick="generateBackup()" class="text-blue-400 font-bold px-2">Backup</button>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1">API Key Engine</label>
                <input id="user-api-key" type="password" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm" onchange="saveApiKey(this.value)">
            </div>
            <textarea id="sync-editor" class="w-full h-48 bg-black border border-slate-800 rounded-xl p-3 text-[10px] text-emerald-500 font-mono" placeholder="Backup data will appear here..."></textarea>
            <div class="flex gap-2">
                <button onclick="copyBackup()" class="flex-1 bg-slate-800 py-3 rounded-xl font-bold text-xs">Copy Code</button>
                <button onclick="importApps()" class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold text-xs">Import Backup</button>
            </div>
        </div>
    </div>
</div>

<script>
    let apiKey = "AIzaSyCBKps__KgVfAbBBwBqGPjUYuc9U_yfets"; 

    const savedKey = localStorage.getItem('xcode_api_key');
    if (savedKey) { apiKey = savedKey; }
    document.getElementById('user-api-key').value = apiKey;

    function saveApiKey(val) {
        apiKey = val;
        localStorage.setItem('xcode_api_key', val);
    }

    let currentPage = 0;
    let installedApps = JSON.parse(localStorage.getItem('xcode_apps') || '[]');

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }
    setInterval(updateClock, 1000); updateClock();

    const canvas = document.getElementById('flappyCanvas');
    const ctx = canvas.getContext('2d');
    let bird, pipes, score, gameActive = false, frame;

    function initFlappy() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        bird = { x: 50, y: canvas.height/2, w: 20, h: 16, v: 0, g: 0.2, j: -4 };
        pipes = []; score = 0; gameActive = true; frame = 0;
    }

    function gameLoop() {
        if (!gameActive) return;
        frame++;
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        bird.v += bird.g; bird.y += bird.v;
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
        if (frame % 100 === 0) {
            const h = Math.random() * (canvas.height - 120) + 20;
            pipes.push({ x: canvas.width, t: h, b: canvas.height - h - 80, w: 40 });
        }
        pipes.forEach((p, i) => {
            p.x -= 2;
            ctx.fillStyle = '#10b981';
            ctx.fillRect(p.x, 0, p.w, p.t);
            ctx.fillRect(p.x, canvas.height - p.b, p.w, p.b);
            if (bird.x + bird.w > p.x && bird.x < p.x + p.w && (bird.y < p.t || bird.y + bird.h > canvas.height - p.b)) gameActive = false;
            if (p.x + p.w < 0) { pipes.splice(i, 1); score++; }
        });
        if (bird.y > canvas.height || bird.y < 0) gameActive = false;
        if (gameActive) requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(!gameActive) { initFlappy(); gameLoop(); } else bird.v = bird.j;
    });

    async function askFlash() {
        const prompt = document.getElementById('ai-prompt').value.trim();
        if (!prompt) return;

        document.getElementById('game-arena').style.display = 'block';
        initFlappy(); gameLoop();

        const btn = document.getElementById('ai-btn');
        const loader = document.getElementById('ai-loader');
        const editor = document.getElementById('code-editor');

        btn.disabled = true;
        loader.classList.remove('hidden');
        editor.value = "// Initializing Neural Engine...\n// Generating layout...";

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Create a single-file HTML/Tailwind/JS mobile app: ${prompt}. UI MUST fit 100vh with NO scrolling. Large touch controls. Pure HTML only.` }] }],
                    systemInstruction: { parts: [{ text: "Senior Mobile Dev. Return ONLY pure HTML/JS code. No markdown code blocks." }] }
                })
            });
            const data = await res.json();
            let code = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            code = code.replace(/```html/gi, "").replace(/```/g, "").trim();

            editor.value = code;
            document.getElementById('game-arena').style.display = 'none';
            gameActive = false;
        } catch (e) {
            editor.value = "// Error: Engine failure. Check API key.";
        } finally {
            btn.disabled = false;
            loader.classList.add('hidden');
        }
    }

    function renderGrid() {
        const wrapper = document.getElementById('page-wrapper');
        const dots = document.getElementById('page-dots');
        wrapper.innerHTML = ''; dots.innerHTML = '';

        const sys = [
            { n: 'Studio', i: '🛠️', c: 'from-blue-600 to-indigo-800', f: () => openWindow('creator-window') },
            { n: 'Settings', i: '⚙️', c: 'from-slate-700 to-slate-900', f: () => openWindow('settings-window') }
        ];

        const all = [...sys, ...installedApps.map((a, idx) => ({ n: a.name, i: a.icon, c: 'bg-slate-800', f: () => launch(idx) }))];
        const pageCount = Math.max(1, Math.ceil(all.length / 12));

        for (let p = 0; p < pageCount; p++) {
            const page = document.createElement('div');
            page.className = 'home-page';
            all.slice(p*12, (p+1)*12).forEach(app => {
                const item = document.createElement('div');
                item.className = 'app-icon';
                item.onclick = app.f;
                const color = app.c.startsWith('bg-') ? app.c : `bg-gradient-to-b ${app.c}`;
                item.innerHTML = `<div class="icon-shape ${color}">${app.i}</div><span class="text-[10px] font-bold">${app.n}</span>`;
                page.appendChild(item);
            });
            wrapper.appendChild(page);
            const dot = document.createElement('div');
            dot.className = `dot ${p === currentPage ? 'active' : ''}`;
            dots.appendChild(dot);
        }
        wrapper.style.transform = `translateX(-${currentPage * 100}%)`;
    }

    function openWindow(id) { document.getElementById(id).style.display = 'flex'; }
    function closeWindow(id) { document.getElementById(id).style.display = 'none'; gameActive = false; }

    function installApp() {
        const name = document.getElementById('app-name-input').value || "Project X";
        const icon = document.getElementById('app-icon-input').value || "📱";
        const code = document.getElementById('code-editor').value;
        if (code.length < 50) return;
        installedApps.push({ name, icon, code });
        localStorage.setItem('xcode_apps', JSON.stringify(installedApps));
        renderGrid(); closeWindow('creator-window');
    }

    function launch(idx) {
        const app = installedApps[idx];
        document.getElementById('runner-title').innerText = app.name;
        document.getElementById('app-sandbox').srcdoc = app.code;
        openWindow('runner-window');
        window.currentIdx = idx;
    }

    function deleteCurrentApp() {
        installedApps.splice(window.currentIdx, 1);
        localStorage.setItem('xcode_apps', JSON.stringify(installedApps));
        renderGrid(); closeWindow('runner-window');
    }

    // FIX: UTF-8 Safe Backup
    function generateBackup() {
        const str = JSON.stringify(installedApps);
        // Uses encodeURIComponent to handle emojis/special chars before b64
        const base64 = btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
            return String.fromCharCode('0x' + p1);
        }));
        document.getElementById('sync-editor').value = base64;
    }

    function copyBackup() {
        const el = document.getElementById('sync-editor');
        el.select();
        document.execCommand('copy');
    }

    // FIX: UTF-8 Safe Import
    function importApps() {
        try {
            const base64 = document.getElementById('sync-editor').value.trim();
            const str = decodeURIComponent(Array.prototype.map.call(atob(base64), function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            const apps = JSON.parse(str);
            if (Array.isArray(apps)) {
                installedApps = apps;
                localStorage.setItem('xcode_apps', JSON.stringify(installedApps));
                renderGrid();
                alert("Import successful!");
            }
        } catch(e) { 
            alert("Import failed. Ensure the code is a valid XCode Mobile backup."); 
        }
    }

    let startX = 0;
    document.getElementById('home-container').addEventListener('touchstart', e => startX = e.touches[0].clientX);
    document.getElementById('home-container').addEventListener('touchend', e => {
        const diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) {
            const max = Math.ceil((installedApps.length + 2) / 12) - 1;
            if (diff > 0 && currentPage < max) currentPage++;
            else if (diff < 0 && currentPage > 0) currentPage--;
            renderGrid();
        }
    });

    renderGrid();
</script>
</body>
</html>
